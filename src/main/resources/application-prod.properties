# Puxa os valores dinamicamente do painel do Railway/Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# O PaaS entende que em produção a DDL nao deve ser alterada automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Secret do JWT que você vai cadastrar apenas no painel da nuvem
api.security.token.secret=${JWT_SECRET_PROD}